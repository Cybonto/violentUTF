# Grafana Datasource Provisioning for ViolentUTF Monitoring
# Issue #270 - Prometheus datasource configuration

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      queryTimeout: 30s
      defaultRegion: us-east-1
    version: 1
