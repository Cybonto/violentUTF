# Grafana Dashboard Provisioning for ViolentUTF Monitoring
# Issue #270 - Dashboard auto-loading configuration

apiVersion: 1

providers:
  - name: 'ViolentUTF Database Monitoring'
    orgId: 1
    folder: 'Database Performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
