[pytest]
# Pytest configuration with problematic test exclusions
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --ignore=tests/test_blocks_direct.py
    --ignore=tests/test_dataset_logging_comprehensive.py
    --ignore=tests/test_issue_117.py
    --ignore=tests/test_issue_281_api_integration.py
    --ignore=tests/test_issue_281_gap_prioritizer.py
    --ignore=tests/test_issue_284_asset_dashboard_api.py
    --ignore=tests/test_issue_284_dashboard_components.py
    --ignore=tests/test_pyrit_memory_bridge.py
    --ignore=tests/test_targets.py
    --ignore=tests/migration_tests/test_pyrit_sqlite_compatibility.py
    --ignore=tests/mcp_tests/chatclient/test_mcp_integration.py
    --ignore=tests/unit/services/test_issue_324_pyrit_memory_bridge.py
    --ignore=tests/ux_tests/test_issue_133_user_workflows.py

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    docker: marks tests that require Docker
    security: marks security-related tests
    benchmark: marks performance benchmark tests
    performance: marks performance-related tests
    problematic: marks tests with known import/dependency issues
    incomplete: marks tests that are incomplete or in TDD red phase
    issue_127: marks tests related to issue #127
    issue_121: marks tests related to issue #121
    issue_282: marks tests related to issue #282
    tdd: marks tests in test-driven development phase
    nist_rmf: marks NIST Risk Management Framework related tests
    nist_nvd: marks NIST National Vulnerability Database related tests
    risk_assessment: marks risk assessment related tests
    risk_engine: marks risk engine related tests
    vulnerability_service: marks vulnerability service related tests
    garak_converter: marks Garak converter related tests
    docmath_converter: marks DocMath converter related tests
    dataset_conversion: marks dataset conversion related tests
    large_file_handling: marks large file handling related tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning